<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><title>FORM — Fitness built around you</title>
<style>
:root{--bg:#050608;--panel:#101318;--panel2:#171c23;--line:#252b34;--text:#f5f7fa;--muted:#8e98a6;--green:#56B4E9;--green2:#132b3c;--orange:#8FCFFF;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:980px;margin:auto;padding:22px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.2em;font-size:20px}.brand span{color:var(--green)}.userdot{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:38px;height:38px;color:var(--green);font-weight:700}.hello{font-size:13px;color:var(--muted);margin-bottom:6px}.headline{font-size:clamp(26px,5vw,38px);font-weight:760;letter-spacing:-.04em;margin:0 0 8px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.nav{display:flex;gap:8px;overflow:auto;margin:22px 0 20px;padding-bottom:2px}.nav button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 14px;border-radius:999px}.nav button.active{background:var(--green);color:#07121b;border-color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cardhead h2{font-size:15px;margin:0}.small{font-size:12px;color:var(--muted)}.workoutcard{background:linear-gradient(145deg,#101a25,#080c12 75%);border-color:#1d4563}.eyebrow{color:var(--green);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:750}.worktitle{font-size:25px;font-weight:750;margin:7px 0}.workmeta{display:flex;gap:15px;color:#bfd7ed;font-size:13px;margin:12px 0 18px}.btn{border:0;background:var(--green);color:#07121b;font-weight:750;padding:12px 16px;border-radius:12px}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.full{width:100%}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--panel2);border-radius:14px;padding:13px}.metric strong{display:block;font-size:22px;margin:5px 0}.metric label{font-size:11px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.rowname{font-weight:650;font-size:14px}.rowdetail{color:var(--muted);font-size:12px;margin-top:4px}.pill{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 9px;font-size:12px;color:var(--muted)}.progressbar{height:8px;background:#1d2a36;border-radius:99px;overflow:hidden;margin:8px 0}.progressbar i{height:100%;display:block;background:var(--green);border-radius:99px}.sectiontitle{font-size:22px;margin:0 0 4px}.sectionintro{margin-bottom:18px}.formrow{margin:12px 0}.formrow label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.formrow input,.formrow select,.formrow textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}.formrow input:focus,.formrow select:focus{border-color:var(--green)}.goalgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.goal{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;gap:9px;align-items:center}.goal.selected{border-color:var(--green);background:#142d43}.goal input{accent-color:var(--green)}.exercise{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.exhead{display:flex;justify-content:space-between;align-items:start;gap:12px}.setgrid{display:grid;grid-template-columns:38px 1fr 1fr 44px;gap:6px;align-items:center;margin-top:9px;font-size:12px}.setgrid input{width:100%;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);padding:9px;border-radius:9px}.setgrid .done{accent-color:var(--green);width:20px;height:20px}.coachbubble{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.5;margin:10px 0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chips button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:9px 12px;border-radius:999px;font-size:12px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--green);color:#07121b;padding:11px 16px;border-radius:12px;font-weight:700;display:none;z-index:10}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(5,6,8,.96);border-top:1px solid var(--line);padding:12px max(16px,calc((100vw - 940px)/2));display:flex;justify-content:space-around;backdrop-filter:blur(12px)}.bottom button{background:transparent;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px}.bottom button.active{color:var(--green)}.bottom .ico{font-size:18px}.hidden{display:none!important}.footnote{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.45}
@media(max-width:700px){#app{padding:18px 15px 105px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.bottom{padding:10px 6px}.bottom button{min-width:58px}}
.onboard-wrap{max-width:560px;margin:22px auto 0}.onboard-step{display:flex;gap:7px;margin:14px 0 22px}.onboard-step i{height:4px;flex:1;background:#252b34;border-radius:8px}.onboard-step i.on{background:#56B4E9}.onboard-title{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:0 0 6px}.onboard-card{background:#101318;border:1px solid #252b34;border-radius:18px;padding:16px;margin:12px 0}.onboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.onboard-grid .formrow{margin:0}.onboard-goals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.onboard-goals label{padding:12px;border:1px solid #252b34;border-radius:12px;background:#171c23;font-size:13px;display:flex;gap:8px;align-items:center}.onboard-goals label:has(input:checked){border-color:#56B4E9;background:#142b3e}.onboard-goals input{accent-color:#56B4E9}.onboard-note{color:#8e98a6;font-size:12px;line-height:1.5}.onboard-footer{position:sticky;bottom:12px;background:#050608;padding:10px 0}.onboard-wrap select,.onboard-wrap input{min-height:44px}@media(max-width:420px){.onboard-grid{grid-template-columns:1fr 1fr}.onboard-title{font-size:26px}}
</style></head><body><div id="app"><div class="top"><div class="brand">F<span>O</span>RM</div><button class="userdot" onclick="show('profile')" title="Profile">B</button></div><div id="view"></div></div><div class="toast" id="toast"></div><nav class="bottom"><button class="active" data-page="home" onclick="show('home')"><span class="ico">⌂</span>Home</button><button data-page="workout" onclick="show('workout')"><span class="ico">▤</span>Workout</button><button data-page="progress" onclick="show('progress')"><span class="ico">↗</span>Progress</button><button data-page="nutrition" onclick="show('nutrition')"><span class="ico">◉</span>Nutrition</button><button data-page="coach" onclick="show('coach')"><span class="ico">✳</span>Coach</button></nav>
<script>
const DEFAULT={name:'Brady',goalPrimary:'Recomposition',goalSecondary:['Build muscle','Get stronger'],days:4,minutes:60,experience:'Intermediate',equipment:'Full gym',weight:180,calories:2450,protein:180,completed:0,history:[],plan:[
{day:'MONDAY',title:'Upper · Chest emphasis',items:[['Incline Dumbbell Press',3,8,10],['Flat Bench Press',3,8,10],['Cable Fly',3,12,15],['Lateral Raise',3,12,15],['Triceps Pushdown',3,10,12]]},
{day:'TUESDAY',title:'Lower · Quad emphasis',items:[['Back Squat',3,6,8],['Leg Press',3,10,12],['Leg Extension',3,12,15],['Leg Curl',3,10,12],['Calf Raise',3,12,15]]},
{day:'THURSDAY',title:'Upper · Back & shoulders',items:[['Pull-ups / Pulldown',3,8,10],['Chest Supported Row',3,8,12],['Overhead Press',3,8,10],['Lateral Raise',3,12,15],['Biceps Curl',3,10,12]]},
{day:'FRIDAY',title:'Lower · Posterior chain',items:[['Romanian Deadlift',3,8,10],['Hip Thrust',3,8,12],['Split Squat',3,8,10],['Leg Curl',3,10,12],['Core',3,12,15]]}]};
let data=JSON.parse(localStorage.getItem('form_data')||'null')||DEFAULT;let page='home';function save(){localStorage.setItem('form_data',JSON.stringify(data))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(p){page=p;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const v=document.getElementById('view');if(p==='onboarding')v.innerHTML=onboarding();if(p==='home')v.innerHTML=home();if(p==='profile')v.innerHTML=profile();if(p==='workout')v.innerHTML=workout();if(p==='progress')v.innerHTML=progress();if(p==='nutrition')v.innerHTML=nutrition();if(p==='coach')v.innerHTML=coach();}
function home(){let today=currentWorkout();return `<div class="hello">TODAY</div><h1 class="headline">Ready to train?</h1><div class="sub">Your plan. Your pace.</div><div class="nav"><button class="active" onclick="show('home')">Overview</button><button onclick="show('profile')">Goals & profile</button></div><div class="grid"><div class="card workoutcard"><div class="eyebrow">Today's session · ${today.day}</div><div class="worktitle">${today.title}</div><div class="workmeta"><span>◷ ${data.minutes} min</span><span>▤ ${today.items.length} exercises</span></div><button class="btn" onclick="show('workout')">Start workout →</button></div><div class="card"><div class="cardhead"><h2>Your focus</h2><span class="pill">Active goals</span></div><div class="row"><div><div class="rowname">${esc(data.goalPrimary)}</div><div class="rowdetail">Primary focus</div></div></div>${(data.goalSecondary||[]).map(g=>`<div class="row"><div class="rowname">${esc(g)}</div><span class="pill">Secondary</span></div>`).join('')}<button class="btn secondary full" style="margin-top:12px" onclick="show('profile')">Adjust goals</button></div><div class="card"><div class="cardhead"><h2>Training this week</h2><span class="small">${data.completed} workouts logged</span></div><div class="progressbar"><i style="width:${Math.min(100,data.completed/data.days*100)}%"></i></div><div class="sub">${data.completed} of ${data.days} planned sessions completed</div></div><div class="card"><div class="cardhead"><h2>Nutrition targets</h2><span class="pill">Daily</span></div><div class="metrics"><div class="metric"><label>CALORIES</label><strong>${data.calories.toLocaleString()}</strong><label>kcal</label></div><div class="metric"><label>PROTEIN</label><strong>${data.protein}g</strong><label>per day</label></div></div><button class="btn secondary full" style="margin-top:12px" onclick="show('nutrition')">View nutrition →</button></div></div>`}
function profile(){let goals=['Lose fat','Build muscle','Recomposition','Get stronger','Athletic performance','Improve endurance','Improve mobility','General health'];return `<div class="hello">YOUR PROFILE</div><h1 class="headline">Make it yours.</h1><div class="sub sectionintro">Your goals aren't fixed. Update them as your fitness journey changes.</div><div class="card"><div class="formrow"><label>Profile name</label><input id="pname" value="${esc(data.name)}"></div><div class="formrow"><label>Primary goal</label><select id="pgoal">${['Lose fat','Build muscle','Recomposition','Get stronger','Athletic performance','Improve endurance','Improve mobility','General health'].map(x=>`<option ${data.goalPrimary===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formrow"><label>Secondary goals (select any)</label><div class="goalgrid">${goals.filter(g=>g!==data.goalPrimary).map(g=>`<label class="goal ${(data.goalSecondary||[]).includes(g)?'selected':''}"><input type="checkbox" value="${g}" ${(data.goalSecondary||[]).includes(g)?'checked':''}>${g}</label>`).join('')}</div></div><div class="formrow"><label>Days available per week · <b id="daysval">${data.days}</b></label><input type="range" min="1" max="7" value="${data.days}" id="days" oninput="document.getElementById('daysval').textContent=this.value"></div><div class="formrow"><label>Workout length</label><select id="minutes"><option ${data.minutes===30?'selected':''}>30</option><option ${data.minutes===45?'selected':''}>45</option><option ${data.minutes===60?'selected':''}>60</option><option ${data.minutes===75?'selected':''}>75</option><option ${data.minutes===90?'selected':''}>90</option></select></div><div class="formrow"><label>Experience</label><select id="experience"><option>Beginner</option><option ${data.experience==='Intermediate'?'selected':''}>Intermediate</option><option ${data.experience==='Advanced'?'selected':''}>Advanced</option></select></div><div class="formrow"><label>Equipment access</label><select id="equipment"><option ${data.equipment==='Full gym'?'selected':''}>Full gym</option><option ${data.equipment==='Home gym'?'selected':''}>Home gym</option><option ${data.equipment==='Dumbbells only'?'selected':''}>Dumbbells only</option><option ${data.equipment==='Bodyweight'?'selected':''}>Bodyweight</option></select></div><div class="formrow"><label>Current weight (lb)</label><input type="number" id="weight" value="${data.weight}" step="0.1"></div><button class="btn full" onclick="saveProfile()">Save profile & goals</button><p class="footnote">Your profile is stored locally on this device. This demo does not upload your information.</p></div>`}
function onboarding(){let sec=data.goalSecondary||[];let goals=['Lose fat','Build muscle','Recomposition','Get stronger','Athletic performance','Improve endurance','Improve mobility','General health'];return `<div class="onboard-wrap"><div class="brand">F<span>O</span>RM</div><div class="onboard-step"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="hello">PERSONAL SETUP</div><h1 class="onboard-title">Let's build your plan.</h1><div class="sub">A few details to make your training fit you.</div><div class="onboard-card"><div class="onboard-grid"><div class="formrow"><label>Age</label><input type="number" id="oa" min="13" max="100" value="${data.age||''}" placeholder="Years"></div><div class="formrow"><label>Sex</label><select id="os"><option value="">Select</option><option ${data.sex==='Male'?'selected':''}>Male</option><option ${data.sex==='Female'?'selected':''}>Female</option><option ${data.sex==='Prefer not to say'?'selected':''}>Prefer not to say</option></select></div><div class="formrow"><label>Height (inches)</label><input type="number" id="oh" min="36" max="96" value="${data.heightIn||''}" placeholder="e.g. 70"></div><div class="formrow"><label>Weight (lb)</label><input type="number" id="ow" min="50" max="800" step="0.1" value="${data.weight||''}" placeholder="Current weight"></div></div></div><div class="onboard-card"><div class="formrow"><label>Primary goal</label><select id="og">${goals.map(g=>`<option ${data.goalPrimary===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="formrow"><label>Other goals</label><div class="onboard-goals">${goals.filter(g=>g!==data.goalPrimary).map(g=>`<label><input type="checkbox" value="${g}" ${(sec.includes(g))?'checked':''}> ${g}</label>`).join('')}</div></div></div><div class="onboard-card"><div class="onboard-grid"><div class="formrow"><label>Training days / week</label><select id="od">${[1,2,3,4,5,6,7].map(n=>`<option ${data.days===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="formrow"><label>Session length</label><select id="om">${[30,45,60,75,90].map(n=>`<option ${data.minutes===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="formrow"><label>Experience</label><select id="oe"><option ${data.experience==='Beginner'?'selected':''}>Beginner</option><option ${data.experience==='Intermediate'?'selected':''}>Intermediate</option><option ${data.experience==='Advanced'?'selected':''}>Advanced</option></select></div><div class="formrow"><label>Equipment</label><select id="eq"><option ${data.equipment==='Full gym'?'selected':''}>Full gym</option><option ${data.equipment==='Home gym'?'selected':''}>Home gym</option><option ${data.equipment==='Dumbbells only'?'selected':''}>Dumbbells only</option><option ${data.equipment==='Bodyweight'?'selected':''}>Bodyweight</option></select></div></div><div class="formrow"><label>Limitations / injuries (optional)</label><input id="ol" value="${esc(data.limitations||'')}" placeholder="Anything to avoid or work around"></div></div><p class="onboard-note">Your profile stays saved on this device. You can change these details and goals later. This setup doesn't replace professional medical advice.</p><div class="onboard-footer"><button class="btn full" onclick="saveOnboarding()">Build my plan →</button></div></div>`}
function saveOnboarding(){let age=+document.getElementById('oa').value,sex=document.getElementById('os').value,height=+document.getElementById('oh').value,weight=+document.getElementById('ow').value;if(!age||!sex||!height||!weight){toast('Please fill in age, sex, height and weight');return;}data.age=age;data.sex=sex;data.heightIn=height;data.weight=weight;data.goalPrimary=document.getElementById('og').value;data.goalSecondary=[...document.querySelectorAll('.onboard-goals input:checked')].map(x=>x.value);data.days=+document.getElementById('od').value;data.minutes=+document.getElementById('om').value;data.experience=document.getElementById('oe').value;data.equipment=document.getElementById('eq').value;data.limitations=document.getElementById('ol').value;data.onboardingComplete=true;generatePlan();save();toast('Your FORM plan is set');show('home')}
function currentWorkout(){return data.plan[(data.completed||0)%Math.max(1,data.plan.length)]||data.plan[0]}
function generatePlan(){
 const n=Math.max(1,Math.min(7,+data.days||4)), goal=data.goalPrimary||'General health', eq=data.equipment||'Full gym';
 const gym=eq==='Full gym', db=eq==='Dumbbells only'||eq==='Home gym', bw=eq==='Bodyweight';
 const pick=(a,b,c)=>gym?a:db?b:c;
 const routines={
  1:[['Full Body',[[pick('Squat','Goblet Squat','Bodyweight Squat'),3,8,12],[pick('Bench Press','Dumbbell Floor Press','Push-up'),3,8,12],[pick('Lat Pulldown','One-arm Dumbbell Row','Inverted Row'),3,8,12],[pick('Romanian Deadlift','Dumbbell RDL','Hip Bridge'),3,8,12],[pick('Lateral Raise','Dumbbell Lateral Raise','Pike Push-up'),2,12,15]]]],
  2:[['Upper Body',[[pick('Bench Press','Dumbbell Press','Push-up'),3,8,12],[pick('Row','Dumbbell Row','Inverted Row'),3,8,12],[pick('Overhead Press','Dumbbell Shoulder Press','Pike Push-up'),3,8,12],[pick('Pulldown','Dumbbell Pullover','Pull-up'),3,8,12]]],['Lower Body',[[pick('Squat','Goblet Squat','Bodyweight Squat'),3,8,12],[pick('Romanian Deadlift','Dumbbell RDL','Single-leg Hip Bridge'),3,8,12],[pick('Lunge','Reverse Lunge','Split Squat'),3,10,12],[pick('Calf Raise','Calf Raise','Calf Raise'),3,12,15]]]],
  3:[['Full Body A',[[pick('Squat','Goblet Squat','Bodyweight Squat'),3,6,10],[pick('Bench Press','Dumbbell Press','Push-up'),3,8,12],[pick('Row','Dumbbell Row','Inverted Row'),3,8,12]]],['Full Body B',[[pick('RDL','Dumbbell RDL','Hip Bridge'),3,8,12],[pick('Overhead Press','Shoulder Press','Pike Push-up'),3,8,12],[pick('Pulldown','Pullover','Pull-up'),3,8,12]]],['Full Body C',[[pick('Leg Press','Goblet Squat','Split Squat'),3,10,12],[pick('Incline Press','Incline Dumbbell Press','Decline Push-up'),3,8,12],[pick('Cable Row','One-arm Row','Inverted Row'),3,8,12]]]],
  4:[['Upper · Push',[[pick('Incline Dumbbell Press','Dumbbell Press','Push-up'),3,8,12],[pick('Bench Press','Floor Press','Push-up'),3,8,12],[pick('Lateral Raise','Lateral Raise','Pike Push-up'),3,12,15],[pick('Triceps Pushdown','Overhead Triceps Extension','Diamond Push-up'),2,10,15]]],['Lower · Quad',[[pick('Squat','Goblet Squat','Bodyweight Squat'),3,6,10],[pick('Leg Press','Goblet Squat','Split Squat'),3,10,12],[pick('Leg Extension','Step-up','Reverse Lunge'),2,12,15],[pick('Calf Raise','Calf Raise','Calf Raise'),3,12,15]]],['Upper · Pull',[[pick('Pull-up / Pulldown','One-arm Row','Inverted Row'),3,8,12],[pick('Chest Supported Row','Dumbbell Row','Inverted Row'),3,8,12],[pick('Rear Delt Fly','Rear Delt Fly','Prone Y Raise'),3,12,15],[pick('Biceps Curl','Dumbbell Curl','Self-resisted Curl'),2,10,15]]],['Lower · Posterior',[[pick('Romanian Deadlift','Dumbbell RDL','Single-leg Hip Bridge'),3,8,12],[pick('Hip Thrust','Glute Bridge','Hip Bridge'),3,8,12],[pick('Leg Curl','Sliding Leg Curl','Hamstring Walkout'),3,10,15],[pick('Split Squat','Split Squat','Split Squat'),2,8,12]]]],
  5:[['Push',[[pick('Bench Press','Dumbbell Press','Push-up'),3,8,12],[pick('Incline Press','Incline Dumbbell Press','Feet-elevated Push-up'),3,8,12],[pick('Overhead Press','Shoulder Press','Pike Push-up'),3,8,12],[pick('Lateral Raise','Lateral Raise','Pike Push-up'),3,12,15]]]],
  6:[['Push',[[pick('Bench Press','Dumbbell Press','Push-up'),3,8,12],[pick('Incline Press','Incline Press','Push-up'),3,8,12],[pick('Shoulder Press','Shoulder Press','Pike Push-up'),3,8,12]]],['Pull',[[pick('Pulldown','Dumbbell Row','Inverted Row'),3,8,12],[pick('Row','One-arm Row','Inverted Row'),3,8,12],[pick('Biceps Curl','Curl','Curl'),3,10,15]]],['Legs',[[pick('Squat','Goblet Squat','Bodyweight Squat'),3,8,12],[pick('RDL','Dumbbell RDL','Hip Bridge'),3,8,12],[pick('Lunge','Reverse Lunge','Split Squat'),3,10,12]]]]
 };
 // 7 days uses a 6-day rotation with one recovery/mobility session
 const templates=routines[n]||routines[6];
 const names=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
 const mobility=[['Recovery · Mobility', [['Mobility Flow',2,10,15],['Easy Core',2,10,15],['Walk / Zone 2',1,20,30]]]];
 let chosen=n===7?[...templates,mobility[0]]:templates;
 while(chosen.length<n){const base=templates[chosen.length%templates.length];chosen.push([base[0]+' · B',base[1].map(e=>[...e])]);}
 const goalSets=goal==='Build muscle'?1:goal==='Lose fat'?-1:0;
 data.plan=chosen.slice(0,n).map((routine,i)=>({day:names[i],title:routine[0],items:routine[1].map(e=>{let item=[...e];if(goalSets===1&&item[1]<4)item[1]++;if(goalSets===-1&&item[1]>2)item[1]--;return item;})}));
 data.log={};
}
function saveProfile(){data.name=document.getElementById('pname').value||'Athlete';data.goalPrimary=document.getElementById('pgoal').value;data.goalSecondary=[...document.querySelectorAll('.goal input:checked')].map(x=>x.value);data.days=+document.getElementById('days').value;data.minutes=+document.getElementById('minutes').value;data.experience=document.getElementById('experience').value;data.equipment=document.getElementById('equipment').value;data.weight=+document.getElementById('weight').value||data.weight;generatePlan();save();toast('Profile saved · training plan rebuilt');show('home')}
function lastExercise(name){return (data.history||[]).slice().reverse().find(h=>h.exerciseData&&h.exerciseData[name]);}
function suggestedLoad(name,range){let last=lastExercise(name);if(!last)return null;let sets=last.exerciseData[name];if(!sets||!sets.length)return null;let completed=sets.filter(x=>x.done);if(!completed.length)return null;let top=completed.every(x=>+x.reps>=range[1]);let maxWeight=Math.max(...completed.map(x=>+x.weight||0));return maxWeight?{weight:top?Math.round((maxWeight+5)*10)/10:maxWeight,top}:null;}
function workout(){let plan=currentWorkout();return `<div class="hello">WORKOUT</div><h1 class="headline">${plan.title}</h1><div class="sub">Log your sets. Track your progress.</div><div class="card" style="margin-top:16px"><div class="cardhead"><h2>Session details</h2><span class="pill">${plan.items.length} exercises</span></div>${plan.items.map((e,idx)=>{let prev=lastExercise(e[0]);let prevSets=prev?.exerciseData?.[e[0]]||[];let suggestion=suggestedLoad(e[0],[e[2],e[3]]);return `<div class="exercise"><div class="exhead"><div><div class="rowname">${e[0]}</div><div class="rowdetail">Target: ${e[1]} sets · ${e[2]}–${e[3]} reps</div></div><span class="pill">${idx+1}</span></div>${prevSets.length?`<div class="coachbubble" style="margin:8px 0"><strong>Last time:</strong> ${prevSets.filter(x=>x.done).map(x=>`${x.weight||0} lb × ${x.reps||0}`).join(' · ')||'No completed sets'}${suggestion?`<br><strong>Suggested today:</strong> ${suggestion.weight} lb${suggestion.top?' · Consider increasing load':''}`:''}</div>`:`<div class="rowdetail" style="margin:8px 0">First logged session for this exercise.</div>`}${Array.from({length:e[1]},(_,s)=>`<div class="setgrid"><span>Set ${s+1}</span><div><input type="number" placeholder="Weight (lb)" id="w-${idx}-${s}" value="${data.log?.[`${idx}-${s}`]?.weight||suggestion?.weight||''}" onchange="logSet(${idx},${s})"></div><div><input type="number" placeholder="Reps" id="r-${idx}-${s}" value="${data.log?.[`${idx}-${s}`]?.reps||''}" onchange="logSet(${idx},${s})"></div><input type="checkbox" class="done" id="c-${idx}-${s}" ${data.log?.[`${idx}-${s}`]?.done?'checked':''} onchange="logSet(${idx},${s})" title="Mark set complete"></div>`).join('')}<button class="btn secondary" style="margin-top:10px" onclick="startRest(90)">Start 90 sec rest</button></div>`}).join('')}<div class="card" style="margin:12px 0;background:var(--panel2)"><div class="cardhead"><h2>Rest timer</h2><strong id="rest-display">90 sec</strong></div><button class="btn secondary full" onclick="startRest(120)">2 min rest</button><button class="btn secondary full" style="margin-top:8px" onclick="stopRest()">Stop timer</button></div><button class="btn full" onclick="finishWorkout()">Finish workout</button></div><p class="footnote">When all sets reach your target reps with good form, add a little weight next time.</p>`}
let restInterval=null,restLeft=0;function startRest(seconds){if(restInterval)clearInterval(restInterval);restLeft=seconds;let d=document.getElementById('rest-display');if(d)d.textContent=restLeft+' sec';restInterval=setInterval(()=>{restLeft--;let el=document.getElementById('rest-display');if(el)el.textContent=restLeft+' sec';if(restLeft<=0){clearInterval(restInterval);restInterval=null;toast('Rest finished — ready for your next set?')}},1000)}function stopRest(){if(restInterval)clearInterval(restInterval);restInterval=null;restLeft=0;let el=document.getElementById('rest-display');if(el)el.textContent='Stopped'}
function logSet(i,s){if(!data.log)data.log={};let k=`${i}-${s}`;data.log[k]={weight:document.getElementById(`w-${i}-${s}`).value,reps:document.getElementById(`r-${i}-${s}`).value,done:document.getElementById(`c-${i}-${s}`).checked};save()}
function finishWorkout(){let plan=currentWorkout(),exerciseData={};plan.items.forEach((e,idx)=>{exerciseData[e[0]]=Array.from({length:e[1]},(_,s)=>{let x=data.log?.[`${idx}-${s}`]||{};return {weight:x.weight||'',reps:x.reps||'',done:!!x.done}})});data.completed++;data.history.push({date:new Date().toLocaleDateString(),timestamp:Date.now(),name:plan.title,sets:Object.values(data.log||{}).filter(x=>x.done).length,exerciseData});data.log={};save();stopRest();toast('Workout saved — nice work!');show('progress')}
function progress(){return `<div class="hello">PROGRESS</div><h1 class="headline">Your progress</h1><div class="sub sectionintro">Your training at a glance.</div><div class="metrics"><div class="metric"><label>WORKOUTS LOGGED</label><strong>${data.completed}</strong></div><div class="metric"><label>BODY WEIGHT</label><strong>${data.weight} lb</strong></div><div class="metric"><label>ACTIVE GOAL</label><strong style="font-size:17px">${esc(data.goalPrimary)}</strong></div><div class="metric"><label>TRAINING DAYS</label><strong>${data.days}/wk</strong></div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Workout history</h2></div>${data.history.length?data.history.slice().reverse().map(h=>`<div class="row"><div><div class="rowname">${esc(h.name)}</div><div class="rowdetail">${esc(h.date)} · ${h.sets} sets completed</div></div><span class="pill">✓</span></div>`).join(''):`<div class="sub">No workouts logged yet.</div>`}</div>`}
function nutrition(){return `<div class="hello">NUTRITION</div><h1 class="headline">Daily targets</h1><div class="sub sectionintro">Daily calorie and protein targets.</div><div class="metrics"><div class="metric"><label>CALORIES</label><strong>${data.calories.toLocaleString()}</strong><label>kcal / day</label></div><div class="metric"><label>PROTEIN</label><strong>${data.protein}g</strong><label>daily target</label></div></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">Starter recipe</h2><div class="row"><div><div class="rowname">Chicken rice power bowl</div><div class="rowdetail">Easy meal prep · high protein</div></div><span class="pill">~520 kcal</span></div><p class="sub">Chicken breast · rice · broccoli · olive oil · seasoning. Cook chicken and rice, steam broccoli, then portion into a bowl. Macro estimates depend on serving sizes.</p><button class="btn secondary full" onclick="toast('Recipe collection coming in a future build')">Browse recipes (next update)</button></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>Nutrition targets</h2><span class="small">Edit local demo values</span></div><div class="formrow"><label>Calories / day</label><input id="cal" type="number" value="${data.calories}"></div><div class="formrow"><label>Protein (g / day)</label><input id="pro" type="number" value="${data.protein}"></div><button class="btn full" onclick="saveNutrition()">Save targets</button></div>`}
function saveNutrition(){data.calories=+document.getElementById('cal').value;data.protein=+document.getElementById('pro').value;save();toast('Nutrition targets saved');show('nutrition')}
function coach(){return `<div class="hello">COACH</div><h1 class="headline">Training help</h1><div class="sub">Quick guidance · Offline preview</div><div class="card" style="margin-top:16px"><div class="coachbubble"><strong>Coach context</strong><br>Goal: ${esc(data.goalPrimary)}<br>Secondary: ${esc(data.goalSecondary.join(', ')||'None selected')}<br>Training: ${data.days} days/week · ${data.minutes} minutes · ${esc(data.experience)}<br>Equipment: ${esc(data.equipment)}</div><div class="chips"><button onclick="coachPrompt('Help me structure my training week for my goals.')">Build my week</button><button onclick="coachPrompt('How should I progress my lifts?')">Progress my lifts</button><button onclick="coachPrompt('Give me a meal idea that supports my goal.')">Meal suggestion</button></div><div class="formrow" style="margin-top:14px"><label>Ask your coach</label><input id="coachq" placeholder="Type a question…"></div><button class="btn full" onclick="coachSend()">Ask coach</button><div id="coachreply"></div></div><p class="footnote">Offline coach preview. No paid AI connected.</p>`}
function coachPrompt(q){document.getElementById('coachq').value=q;coachSend()}function coachSend(){let q=document.getElementById('coachq').value.trim();if(!q)return;let answer='Based on your current focus of '+data.goalPrimary+', keep your plan consistent and track performance week to week. For now, use your logged workout history to guide increases: when you can complete the top of your rep range with good form, consider a small weight increase. If fatigue or discomfort is unusually high, reduce load or volume and prioritize recovery. This demo coach is not AI-connected yet.';document.getElementById('coachreply').innerHTML=`<div class="coachbubble"><strong>You asked:</strong> ${esc(q)}<hr style="border-color:var(--line)"><strong>Coach preview:</strong> ${esc(answer)}</div>`}
if(!data.onboardingComplete){show('onboarding')}else{show('home')}
</script></body></html>
